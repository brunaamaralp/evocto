  force = true

[[redirects]]
  from = "/api/campanha-anual/"
  to = "/.netlify/functions/campanha-anual"
  status = 200
  force = true

# Service Worker e assets PWA — não cachear o SW no CDN
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

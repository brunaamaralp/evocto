[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["lib/server/**", "src/lib/**"]

# APIs antes do SPA fallback
[[redirects]]
  from = "/api/material-deliveries"
  to = "/.netlify/functions/material-deliveries"
  status = 200
  force = true

[[redirects]]
  from = "/api/material-deliveries/"
  to = "/.netlify/functions/material-deliveries"
  status = 200
  force = true

[[redirects]]
  from = "/api/schedule-push"
  to = "/.netlify/functions/schedule-push"
  status = 200
  force = true

[[redirects]]
  from = "/api/schedule-push/"
  to = "/.netlify/functions/schedule-push"
  status = 200
  force = true

[[redirects]]
  from = "/api/team-members"
  to = "/.netlify/functions/team-members"
  status = 200
  force = true

[[redirects]]
  from = "/api/team-members/"
  to = "/.netlify/functions/team-members"
  status = 200
  force = true

[[redirects]]
  from = "/api/campaigns-agent"
  to = "/.netlify/functions/campaigns-agent"
  status = 200
  force = true

[[redirects]]
  from = "/api/campaigns-agent/"
  to = "/.netlify/functions/campaigns-agent"
  status = 200
  force = true

[[redirects]]
  from = "/api/campaigns/agent/*"
  to = "/.netlify/functions/campaigns-agent"
  status = 200
  force = true

[[redirects]]
  from = "/api/campanha-anual-temas"
  to = "/.netlify/functions/campanha-anual-temas"
  status = 200
  force = true

[[redirects]]
  from = "/api/campanha-anual-temas/"
  to = "/.netlify/functions/campanha-anual-temas"

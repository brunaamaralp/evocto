<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6C47D8" />
    <title>Evocto — Offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f2fc;
        --ink: #18162a;
        --muted: #7a7595;
        --accent: #6c47d8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at top, #efe9ff, var(--bg) 55%);
        color: var(--ink);
      }
      main {
        width: min(28rem, 100%);
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        margin: 0 auto 1rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.05); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Evocto" width="72" height="72" />
      <h1>Você está offline</h1>
      <p>A Evocto precisa de conexão para carregar dados novos. Quando a rede voltar, toque em tentar novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
